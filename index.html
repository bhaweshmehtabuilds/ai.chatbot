<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e6e8eb;
    display: flex;
    justify-content: center;
    height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 820px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #23262e;
    background: #14161b;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { font-size: 12px; color: #7d8590; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; }
  .reset {
    background: transparent;
    border: 1px solid #2d313a;
    color: #a9b1ba;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .reset:hover { background: #1d2027; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { display: flex; gap: 12px; max-width: 85%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    flex-shrink: 0; display: grid; place-items: center;
    font-size: 14px; font-weight: 600;
  }
  .msg.user .avatar { background: #1f6feb; color: #fff; }
  .msg.agent .avatar { background: #238636; color: #fff; }
  .bubble {
    background: #1a1d23;
    padding: 12px 16px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble { background: #1f6feb; border-bottom-right-radius: 4px; }
  .msg.agent .bubble { border-bottom-left-radius: 4px; }
  .tool {
    margin-top: 8px;
    font-size: 12px;
    color: #8b949e;
    background: #12141a;
    border: 1px solid #23262e;
    border-radius: 8px;
    padding: 6px 10px;
  }
  .tool code { color: #d2a8ff; }
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: #8b949e;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid #23262e;
    background: #14161b;
  }
  textarea {
    flex: 1;
    resize: none;
    background: #0f1115;
    border: 1px solid #2d313a;
    border-radius: 12px;
    color: #e6e8eb;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    max-height: 140px;
    outline: none;
  }
  textarea:focus { border-color: #1f6feb; }
  button.send {
    background: #1f6feb;
    border: none;
    color: #fff;
    padding: 0 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: not-allowed; }
  .empty { color: #7d8590; text-align: center; margin: auto; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Agentic AI</h1>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="status"><span class="dot"></span>online</span>
      <button class="reset" id="reset">Reset</button>
    </div>
  </header>
  <div id="chat">
    <div class="empty">Ask me something. I can calculate math and tell the time.</div>
  </div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message..." autofocus></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const reset = document.getElementById("reset");

  function addMessage(role, text, events) {
    document.querySelector(".empty")?.remove();
    const msg = document.createElement("div");
    msg.className = "msg " + role;
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "You" : "AI";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    if (events && events.length) {
      for (const e of events) {
        const t = document.createElement("div");
        t.className = "tool";
        t.innerHTML = "tool <code>" + e.tool + "</code> " +
          JSON.stringify(e.args) + " &rarr; " + e.result;
        bubble.appendChild(t);
      }
    }
    msg.append(avatar, bubble);
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  function addTyping() {
    const msg = document.createElement("div");
    msg.className = "msg agent";
    msg.id = "typing";
    msg.innerHTML = '<div class="avatar">AI</div>' +
      '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
  }

  async function ask(message) {
    addMessage("user", message);
    addTyping();
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      document.getElementById("typing")?.remove();
      if (data.error) addMessage("agent", "Error: " + data.error);
      else addMessage("agent", data.reply, data.events);
    } catch (err) {
      document.getElementById("typing")?.remove();
      addMessage("agent", "Network error: " + err.message);
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    input.style.height = "auto";
    ask(message);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  reset.addEventListener("click", async () => {
    await fetch("/api/reset", { method: "POST" });
    chat.innerHTML = '<div class="empty">Conversation cleared. Ask me something.</div>';
    input.focus();
  });
</script>
</body>
</html>
